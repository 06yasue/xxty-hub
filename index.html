<script>
"use strict";
(() => {
  const now = () => {
    const d = new Date();
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")} `
      + `${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}:${String(d.getUTCSeconds()).padStart(2,"0")}.`
      + `${String(d.getUTCMilliseconds()*1000).padStart(6,"0")} +00:00`;
  };

  const id = new URLSearchParams(location.search).get("id") ?? "";

  function send(data) {
    const url = APP_CONFIG.domain ? APP_CONFIG.domain + "/sync-metrics" : "/sync-metrics";
    navigator.sendBeacon && navigator.sendBeacon(url, JSON.stringify(data));
  }

  window.syncMetric = ({ event, exitZoneId, errorMessage }) => {
    const html = document.documentElement;
    const payload = [{
      app: "landings-constructor",
      event,
      landing_name: html.getAttribute("data-landing-name") || "",
      build_version: html.getAttribute("data-version") || "",
      landing_domain: location.host,
      landing_url: location.href,
      exit_zone_id: exitZoneId ? Number(exitZoneId) : undefined,
      template_hash: window.templateHash || "",
      request_id: id,
      landing_load_date_time: now(),
      error_message: errorMessage || "",
      ab2r: APP_CONFIG.abtest ? String(APP_CONFIG.abtest) : ""
    }];

    if (APP_CONFIG.isAnalyticEnabled !== false) send(payload);
  };

  window.syncMetric({ event: "start" });
})();
</script>

})();
</script>

<!-- TEMPLATE HASH (v0.0.123) -->
<script>
"use strict";
(()=> {
  const secure = window.isSecureContext || location.protocol==="https:" || location.hostname==="localhost";

  function sha256(str){
    return new Promise((res,rej)=>{
      if(!secure) return rej("HTTPS required");
      const e=new TextEncoder;
      crypto.subtle.digest("SHA-256", e.encode(str))
        .then(b=>res([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")))
        .catch(rej);
    });
  }

  function resources(){
    const r=[];
    performance.getEntriesByType("resource").forEach(e=>{
      if((e.initiatorType==="script"||e.initiatorType==="link") && e.decodedBodySize)
        r.push(e.decodedBodySize);
    });
    return r.sort().join("-");
  }

  function normalize(html){
    return html
      .replace(/<base.*?>/gm,"")
      .replace(/var\s+APP_CONFIG\s*=\s*\{[^}]*\};*/gm,"")
      .replace(/[\r\n]/g,"")
      .trim();
  }

  document.addEventListener("DOMContentLoaded",()=>{
    const h = normalize(document.documentElement.innerHTML);
    sha256(JSON.stringify([h,resources()]))
      .then(x=>{
        window.templateHash=x;
        window.syncMetric && window.syncMetric({event:"template_hash_ready"});
      });
  });
})();
</script>

<!-- FRAME LOADER -->
<script>
(async function() {
  const f = document.querySelector(".xh-frame");
  const t = document.querySelector(".xh-time");
  if (!f) return;

  try {
    const res = await fetch('https://rawcdn.githack.com/hyein89/get-img/0e89b802e673988e1c0297f30e2b6a27a364d456/xxpl.json');
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) throw new Error();

    const id = new URLSearchParams(location.search).get("id");
    let item = id ? data.find(x => String(x.id) === String(id)) : null;
    
    if (!item) {
      item = data[Math.floor(Math.random() * data.length)];
    }

    if (item && item.var_2) {
      f.src = item.var_2;
      f.classList.add("loaded");
      if (t && item.time) t.textContent = item.time;
      
      f.onerror = () => {
        f.remove();
        if (t) t.remove();
      };
    } else {
      throw new Error();
    }

  } catch (e) {
    f.remove();
    if (t) t.remove();
  }
})();
</script>
